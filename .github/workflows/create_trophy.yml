name: create_trophy
on:
  schedule:
     - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

# Lisätään tarvittavat oikeudet tokenille tiedostojen kirjoitusta varten
permissions:
  contents: write

jobs:
  create-trophy:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v5

    - name: Generate trophy
      uses: Erik-Donath/github-profile-trophy@feature/generate-svg
      with:
        username: Dragonius
        file: dist/trophy.svg
      env:
        # Siirretty token oikeaan paikkaan env-osion alle
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Debug workspace
      run: |
        pwd
        find . -type f

    - name: Verify SVG generated
      run: |
        if [ -f dist/trophy.svg ]; then
          echo "SVG exists ($(wc -c < dist/trophy.svg) Bytes)"
          file dist/trophy.svg
        else
          echo "SVG failed to generate"
          exit 1
        fi

    - name: push_github-contribution-trophy.svg
      uses: crazy-max/ghaction-github-pages@v3.1.0
      with:
        target_branch: trophy
        build_dir: dist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
